name: CI
on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install & build & test
        run: |
          npm ci
          npm run build
          npm test
      - name: Audit production (high échec)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false
